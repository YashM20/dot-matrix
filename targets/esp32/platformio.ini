; Dot/480 dotvm on ESP32 + WS2812 (FastLED). Build: `pio run -d targets/esp32 -t upload`
; Matrix size / pin / Wi-Fi via build_flags below (or -D on the command line).
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = fastled/FastLED@^3.7.0
build_src_filter = +<dotvm.c> +<sketch/main.cpp>
build_flags =
  -ffp-contract=off          ; bit parity with the TS VM (no fused multiply-add)
  -DDOT_W=16 -DDOT_H=16 -DDOT_PIN=13 -DDOT_SERPENTINE=1 -DDOT_FPS=30
  '-DWIFI_SSID=""' '-DWIFI_PASS=""'
