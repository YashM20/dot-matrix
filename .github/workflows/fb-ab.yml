# Temporary (frame budget PR): main and this branch benched alternately on one runner. Removed before merge.
name: fb-ab
on:
  push:
    branches: [chore/frame-budget-2]
    paths: ['src/**', 'scripts/bench.ts', '.github/workflows/fb-ab.yml']
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: A/B bench
        run: |
          git fetch -q origin main
          base=$(git merge-base HEAD origin/main)
          mkdir -p ab
          for i in 1 2 3; do
            git checkout -q "$base" -- src && RUNS=21 pnpm -s bench --cards all > ab/main-$i.txt
            git checkout -q HEAD -- src && RUNS=21 pnpm -s bench --cards all > ab/branch-$i.txt
          done
          node -e '
            const fs = require("fs"), med = a => a.sort((x, y) => x - y)[a.length >> 1]
            const parse = f => { const t = fs.readFileSync(f, "utf8"), b = {}, c = {}
              for (const l of t.split("\n")) { const m = l.match(/^(\S+)\s+\d+\s+\d+\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/); if (m && !/^card/.test(l)) b[m[1]] = [+m[2], +m[3]]
                const k = l.match(/^(\S+)\s+(Y|GPU|)\s+\d+\s+\d+\s+(canvas|svg)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.-]+)/); if (k) c[k[1]] = [+k[6], k[7] === "-" ? 0 : +k[7]] }
              return { b, c } }
            const runs = s => [1, 2, 3].map(i => parse(`ab/${s}-${i}.txt`)), A = runs("main"), B = runs("branch")
            const boards = Object.keys(A[0].b), cards = Object.keys(A[0].c)
            console.log("board        mount main  mount br   frame main  frame br")
            for (const id of boards) { const g = (R, j) => med(R.map(r => r.b[id]?.[j] ?? NaN)).toFixed(2); console.log(id.padEnd(12), g(A, 0).padStart(10), g(B, 0).padStart(10), g(A, 1).padStart(12), g(B, 1).padStart(9)) }
            console.log("\ncard              mount main  mount br   frame main  frame br")
            for (const id of cards) { const g = (R, j) => med(R.map(r => r.c[id]?.[j] ?? NaN)); const a = g(A, 1), b = g(B, 1), am = g(A, 0), bm = g(B, 0); if (Math.abs(a - b) > .1 || Math.abs(am - bm) > .2 || a > 2) console.log(id.padEnd(18), am.toFixed(2).padStart(10), bm.toFixed(2).padStart(10), a.toFixed(2).padStart(12), b.toFixed(2).padStart(9)) }
          '
          for s in main branch; do echo "== $s run 3, live cards"; sed -n "/^Live CPU/,/^\$/p" ab/$s-3.txt; done
