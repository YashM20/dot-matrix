# Dot/480 CI: typecheck + lint + acceptance harness (`pnpm check`) and a production build.
# MASTER-PLAN §4 P0.6 / §6: golden hashes and perf budgets join here once their scripts land.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json has no "packageManager" field, so pin pnpm 10 here
      # (pnpm-lock.yaml is lockfileVersion 9.0, which pnpm 9 and 10 both read).
      # If "packageManager" is added later, delete `version:` - action-setup fails when both are set and disagree.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # tsc -b, oxlint, and the headless acceptance harness (src/engine/verify-acceptance.ts)
      - name: Check
        run: pnpm check

      # also writes dist/og/*.png and dist/<board>/index.html (vite.config.ts → scripts/site/postbuild.ts);
      # SITE_URL (repo variable, e.g. https://dot480.pages.dev) makes og:image / og:url absolute
      - name: Build
        run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # first-load JS ≤ 150 kB gz (docs/WEB-PLAN.md §1)
      - name: Bundle budget
        run: pnpm exec tsx scripts/site/size.ts --check

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

      # Fails on any drift of a preset's quantized dot list. Intentional visual changes:
      # run `pnpm golden` locally and commit goldens/hashes.json with the change.
      - name: Golden hashes
        run: pnpm golden --check

      # Report-only: shared CI runners are too noisy to gate on timings yet (MASTER-PLAN §6).
      # Switch to `pnpm bench --strict` once budgets are met on a stable runner.
      - name: Perf report
        run: pnpm bench
        continue-on-error: true

  # Cloudflare Pages, direct upload (docs/DEPLOY.md). Push to main → production; a PR → a preview at
  # <branch>.<project>.pages.dev. Skipped (green) until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
  # secrets exist, and on PRs from forks (no secrets there).
  deploy:
    name: deploy (Cloudflare Pages)
    needs: check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'dot480' }}
      BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
    steps:
      - name: Secrets present?
        id: gate
        run: |
          # branch names become a preview alias and a CLI argument: keep [A-Za-z0-9._-] only
          echo "branch=$(printf %s "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Cloudflare secrets not set: skipping deploy (docs/DEPLOY.md)" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Download site
        if: steps.gate.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy
        if: steps.gate.outputs.ok == 'true'
        id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJECT }} --branch=${{ steps.gate.outputs.branch }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.gate.outputs.ok == 'true'
        run: echo "Deployed ${{ steps.gate.outputs.branch }} → ${{ steps.wrangler.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
