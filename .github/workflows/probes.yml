# Browser probes and screenshots on GitHub's runners instead of a laptop (docs/HARNESS.md › Probes in CI).
# One job picks the probes and builds the site; the probe shards (scripts/ci/probes.ts) and the screenshot job use
# that dist/. A PR push runs the probes its changes reach (scripts/ci/affected.ts) plus a smoke set; a push to main,
# a dispatch with `probes=all` and a PR labelled `full-probes` run every probe.
# Report-only for now: this workflow is not part of the `check + build` gate in ci.yml.
name: probes

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'public/**'
      - '.github/workflows/probes.yml'
  pull_request:
    # labeled: adding `full-probes` starts a run with every probe; any other label skips (the build job's `if`)
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'public/**'
      - '.github/workflows/probes.yml'
  workflow_dispatch:
    inputs:
      probes:
        description: 'Comma list of probe names (scripts/ci/probes.ts --list), all, or none'
        default: all
      shots:
        description: 'Comma list of route@width[@theme] screenshots, e.g. /browse/@1280,/@390@light'
        default: ''
      lighthouse:
        description: 'Lighthouse on the SEO routes (scripts/ci/lighthouse.ts): build, live, both or none'
        default: build
      lighthouse_routes:
        description: 'Lighthouse on these routes only, e.g. /,/mosaic/ (empty = the SEO routes); a focused run keeps the traces'
        default: ''
      lighthouse_runs:
        description: 'Lighthouse runs per route and form; the median-TBT run is reported'
        default: '1'

permissions:
  contents: read

# a new push to a PR cancels its stale run; dispatched runs and main queue, so every ask finishes.
# A label event gets its own group, so labelling a PR never cancels the run of its last push.
concurrency:
  group: probes-${{ github.event_name }}-${{ github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Chrome on a runner has no GPU: let WebGL fall back to the software rasterizer, as it does on a laptop
  CHROME_FLAGS: --enable-unsafe-swiftshader
  SHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.shots || '/@1280,/@390@light,/browse/@1280,/browse/@390@light,/widget/timer/@1280@light,/widget/timer/@390' }}

jobs:
  build:
    name: build
    if: github.event.action != 'labeled' || github.event.label.name == 'full-probes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      probes: ${{ steps.pick.outputs.probes }}
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # a PR checks out its merge commit: HEAD^1 is the base, so the diff is the PR's own change
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: ./.github/actions/setup

      # which probes run, and why: printed here and in the run summary
      - name: Pick probes
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          ASKED: ${{ inputs.probes }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-probes') }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then probes="$ASKED"; why="asked for: $ASKED"
          elif [ "$EVENT" = push ]; then probes=all; why="push to main: every probe"
          elif [ "$FULL_LABEL" = true ]; then probes=all; why="the PR has the full-probes label: every probe"
          else probes=$(pnpm exec tsx scripts/ci/affected.ts --base HEAD^1); why="the probes this PR's changes reach (above)"
          fi
          echo "probes: $probes ($why)"
          echo "**Probes:** $probes ($why)" >> "$GITHUB_STEP_SUMMARY"
          echo "probes=$probes" >> "$GITHUB_OUTPUT"

      # which shards have work (a bad name fails here, before any shard starts)
      - name: Shards
        id: matrix
        env:
          PROBES: ${{ steps.pick.outputs.probes }}
        run: echo "shards=$(pnpm exec tsx scripts/ci/probes.ts --matrix --only "$PROBES")" | tee -a "$GITHUB_OUTPUT"

      # the same OG cache as ci.yml, so the postbuild re-renders only changed cards
      - name: Restore OG image cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/dot480-og
          key: og-${{ hashFiles('goldens/**', 'scripts/og.ts', 'scripts/lib/raster.ts', 'scripts/lib/cards.ts', 'scripts/lib/stats.ts', 'src/engine/sampler/gridSampler.ts') }}
          restore-keys: og-

      - name: Build
        run: pnpm exec vite build

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  probes:
    name: probes ${{ matrix.shard }}
    needs: build
    if: needs.build.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Probes
        env:
          PROBES: ${{ needs.build.outputs.probes }}
        run: pnpm exec tsx scripts/ci/probes.ts --shard ${{ matrix.shard }} --only "$PROBES"

      # the probes' own captures, to look at when one fails
      - name: Upload probe captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-captures-${{ matrix.shard }}
          path: .snapshots
          # .snapshots is a dot folder: upload-artifact skips hidden files unless asked
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore

  shots:
    name: screenshots
    needs: build
    if: github.event_name == 'pull_request' || inputs.shots != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Screenshots
        run: pnpm exec tsx scripts/ci/shots.ts --list "$SHOTS" --out shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: shots
          retention-days: 7
          if-no-files-found: ignore

  # Lighthouse (the PageSpeed Insights engine, no API key) on the SEO routes, mobile and desktop, through the one script
  # the seo-audit workflow runs too (dist/ served like Vercel): Performance, Accessibility, SEO, Best practices, LCP, CLS,
  # TBT and the audits that lost points, in the job summary and the `lighthouse` artifact.
  # A report like the rest of this workflow. `live` audits the production site instead of this build.
  lighthouse:
    name: lighthouse ${{ matrix.target }}
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.lighthouse != 'none'
    runs-on: ubuntu-latest
    # a PR push audits three key routes on mobile, once each (about 2 minutes); main and dispatches run the full set
    timeout-minutes: ${{ github.event_name == 'pull_request' && 12 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(github.event_name == 'workflow_dispatch' && (inputs.lighthouse == 'both' && '["build","live"]' || format('["{0}"]', inputs.lighthouse)) || '["build"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.target == 'build'
        with:
          name: dist
          path: dist

      - name: Lighthouse
        # a step limit below the job's, so a long focused run (lighthouse_runs) still uploads what it measured
        timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 50 }}
        env:
          TARGET: ${{ matrix.target }}
          EVENT: ${{ github.event_name }}
          LH_ROUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.lighthouse_routes || '' }}
          LH_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.lighthouse_runs || '1' }}
        run: |
          set -- --out lh --runs "$LH_RUNS"
          [ "$TARGET" = live ] && set -- "$@" --base https://matrix.reactopia.me/
          [ -n "$LH_ROUTES" ] && set -- "$@" --routes "$LH_ROUTES" --trace
          [ "$EVENT" = pull_request ] && set -- "$@" --routes /,/henry/,/mosaic/ --forms mobile --timeout 90
          pnpm exec tsx scripts/ci/lighthouse.ts "$@"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ matrix.target }}
          path: lh
          retention-days: 7
          if-no-files-found: ignore
