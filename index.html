<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: the shell pads itself with env(safe-area-inset-*) (src/site/mobile.css); pinch zoom stays -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070809" />
    <meta name="color-scheme" content="dark" />
    <!-- installable: Add to Home Screen opens it standalone, like an app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DOT/480" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>DOT/480 — a field-based dot-matrix UI engine</title>
    <!-- per-page tags: scripts/site/postbuild.ts rewrites this block (and the title) per board; src/site/meta.ts at runtime -->
    <!-- meta -->
    <meta name="description" content="Interfaces drawn entirely in dots: every card is a field, sampled onto a quantized dot grid and rendered live. Boards, a playground, a Field IR REPL and a drawing board." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DOT/480" />
    <meta property="og:title" content="DOT/480 — a field-based dot-matrix UI engine" />
    <meta property="og:image" content="/og/default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /meta -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
