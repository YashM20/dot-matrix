<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070809" />
    <!-- no-flash theme boot: src/site/theme/boot.ts (written by scripts/site/theme.ts --write; its sha256 is in vercel.json's CSP) -->
    <!-- theme-boot -->
    <script>(function(){try{var d=document.documentElement,q=new URLSearchParams(location.search),S=/^(system|dark|light)$/,A=/^(signal|amber|phosphor|cyan|cobalt|vite|magenta)$/,t=(q.get('theme')||'').split('_'),j=null,s,a;if(!(S.test(t[0])&&A.test(t[1])))t=[];try{j=JSON.parse(localStorage.getItem('dot480:theme'))}catch(e){}j=j||{};s=[q.get('scheme'),t[0],j.scheme].filter(function(x){return S.test(x)})[0]||'system';a=[q.get('accent'),t[1],j.accent].filter(function(x){return A.test(x)})[0]||'signal';if(s=='system')s=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';d.setAttribute('data-scheme',s);d.setAttribute('data-accent',a);var m=document.querySelector('meta[name=color-scheme]');if(m)m.content=s;m=document.querySelector('meta[name=theme-color]');if(m)m.content=s=='light'?'#F1F0EC':'#070809'}catch(e){}})()</script>
    <!-- /theme-boot -->
    <title>Ditherpunk for UI: how Dot/480 turns fields into dots</title>
    <meta name="description" content="An explorable deep-dive into Dot/480, a hobby dot-matrix renderer: fields, sampling, quantization, lattices, one accent, motion, light, simulation, halftone and five surfaces from one source." />
  </head>

    <div id="essay"></div>

  </body>
